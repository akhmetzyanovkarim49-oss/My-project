<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Messenger Телефон</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: #0f0f10; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; }
        .card { background: #1a1a1e; border: 1px solid #2a2a2e; border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 15px; }
        input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #3a3a3c; background: #2c2c2e; color: #fff; font-size: 18px; text-align: center; margin-bottom: 12px; outline: none; }
        button { width: 100%; padding: 14px; border-radius: 12px; border: none; background: #0084ff; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
        #chat-screen { display: none; flex-direction: column; height: 100%; }
        #messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px; border: 1px solid #2a2a2e; border-radius: 12px; }
        .msg { padding: 10px 14px; border-radius: 14px; font-size: 15px; max-width: 80%; word-break: break-word; }
        .incoming { background: #2c2c2e; align-self: flex-start; }
        .outgoing { background: #0084ff; align-self: flex-end; }
        .input-area { display: flex; gap: 10px; margin-top: 15px; }
    </style>
</head>
<body>
    <div id="main-screen">
        <div class="card">
            <h3>Подключение к ПК</h3>
            <!-- Введи локальный IP ПК (например, 192.168.1.50) или внешний адрес -->
            <input type="text" id="pc-ip" placeholder="IP хоста (например 192.168.1.50:8080)">
            <input type="number" id="friend-code" placeholder="Введите 6 цифр с ПК" oninput="if(this.value.length > 6) this.value = this.value.slice(0, 6);">
            <button onclick="startChat()">Войти в чат</button>
        </div>
    </div>

    <div id="chat-screen">
        <h3>P2P Чат (Телефон)</h3>
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendMsg()">
            <button onclick="sendMsg()" style="width: 60px;">➔</button>
        </div>
    </div>

    <script>
        const myId = 'phone_' + Math.floor(Math.random() * 1000);
        let pcUrl = localStorage.getItem('pc_url') || '';
        let activeCode = '';
        let lastMsgId = -1;

        if (pcUrl) document.getElementById('pc-ip').value = pcUrl.replace('http://', '');

        function startChat() {
            let ip = document.getElementById('pc-ip').value.trim();
            activeCode = document.getElementById('friend-code').value.trim();

            if (!ip) return alert("Укажи IP своего ПК!");
            if (activeCode.length !== 6) return alert("Нужно ввести 6 цифр!");

            if (!ip.startsWith('http')) ip = 'http://' + ip;
            pcUrl = ip;

            localStorage.setItem('pc_url', pcUrl);

            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';

            // Начинаем спать и ждать сообщения от ПК (без расхода батареи)
            listenLoop();
        }

        async function listenLoop() {
            while (true) {
                try {
                    const res = await fetch(`${pcUrl}/api/wait`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code: activeCode, last_id: lastMsgId })
                    });
                    const data = await res.json();
                    if (data.status === 'ok' && data.msgs) {
                        data.msgs.forEach(m => {
                            const type = m.sender === myId ? 'outgoing' : 'incoming';
                            appendMessage(m.text, type);
                            lastMsgId = m.id;
                        });
                    }
                } catch (e) {
                    await new Promise(r => setTimeout(r, 2000));
                }
            }
        }

        async function sendMsg() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (text !== '') {
                input.value = '';
                await fetch(`${pcUrl}/api/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: activeCode, sender: myId, text: text })
                });
            }
        }

        function appendMessage(text, type) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${type}`;
            msgDiv.innerText = text;
            const container = document.getElementById('messages');
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
