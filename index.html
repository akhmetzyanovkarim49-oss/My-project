<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Messenger</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: #0f0f10; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; }
        .card { background: #1a1a1e; border: 1px solid #2a2a2e; border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .my-code { font-size: 36px; font-weight: bold; color: #0084ff; letter-spacing: 4px; font-family: monospace; }
        input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #3a3a3c; background: #2c2c2e; color: #fff; font-size: 20px; text-align: center; margin-bottom: 12px; outline: none; }
        button { width: 100%; padding: 14px; border-radius: 12px; border: none; background: #0084ff; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
        #chat-screen { display: none; flex-direction: column; height: 100%; }
        #messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px; border: 1px solid #2a2a2e; border-radius: 12px; }
        .msg { padding: 10px 14px; border-radius: 14px; font-size: 15px; max-width: 80%; word-break: break-word; }
        .incoming { background: #2c2c2e; align-self: flex-start; }
        .outgoing { background: #0084ff; align-self: flex-end; }
        .input-area { display: flex; gap: 10px; margin-top: 15px; }
    </style>
</head>
<body>
    <div id="main-screen">
        <div class="card">
            <div style="color: #8e8e93; font-size: 14px;">МОЙ ID</div>
            <div id="my-code" class="my-code">------</div>
        </div>
        <div class="card">
            <input type="number" id="friend-code" placeholder="Введите 6 цифр" oninput="if(this.value.length > 6) this.value = this.value.slice(0, 6);">
            <button id="btn-connect" onclick="searchDevice()">Найти и Подключиться</button>
        </div>
    </div>

    <div id="chat-screen">
        <h3>Чат с [<span id="connected-id">------</span>]</h3>
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="Сообщение..." style="text-align: left;" onkeydown="if(event.key==='Enter') sendMsg()">
            <button onclick="sendMsg()" style="width: 60px;">➔</button>
        </div>
    </div>

    <script>
        const myId = Math.floor(100000 + Math.random() * 900000).toString();
        document.getElementById('my-code').innerText = myId;

        // Подключаем альтернативный рабочий сервер PeerServer + STUN
        const peer = new Peer(myId, {
            host: 'peerjs.9252.de',
            port: 443,
            secure: true,
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        });

        let conn = null;

        peer.on('error', (err) => {
            alert('Ошибка сервера/сети: ' + err.type);
            document.getElementById('btn-connect').innerText = 'Найти и Подключиться';
        });

        peer.on('connection', (c) => {
            conn = c;
            setupChat(c.peer);
        });

        function searchDevice() {
            const code = document.getElementById('friend-code').value;
            if (code.length !== 6) return alert("Нужно 6 цифр!");
            if (code === myId) return alert("Нельзя к себе!");

            document.getElementById('btn-connect').innerText = 'Подключение...';
            conn = peer.connect(code, { reliable: true });
            setupChat(code);
        }

        function setupChat(peerId) {
            if (!conn) return;
            document.getElementById('connected-id').innerText = peerId;

            conn.on('open', () => {
                document.getElementById('main-screen').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'flex';
            });

            conn.on('data', (data) => appendMessage(data, 'incoming'));
            conn.on('close', () => { alert('Связь закрыта'); location.reload(); });
        }

        function sendMsg() {
            const input = document.getElementById('msg-input');
            if (input.value.trim() !== '' && conn) {
                conn.send(input.value.trim());
                appendMessage(input.value.trim(), 'outgoing');
                input.value = '';
            }
        }

        function appendMessage(text, type) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${type}`;
            msgDiv.innerText = text;
            const container = document.getElementById('messages');
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
