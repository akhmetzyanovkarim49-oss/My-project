<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #121212; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; padding: 12px; }
        .header { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        label { font-size: 12px; color: #aaa; font-weight: bold; }
        input, select, button { background: #1e1e1e; color: #fff; border: 1px solid #333; padding: 10px; border-radius: 8px; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #007bff; }
        button { background: #007bff; border: none; font-weight: bold; cursor: pointer; }
        button:active { background: #0056b3; }
        button:disabled { background: #444; color: #888; }
        .chat-box { flex: 1; overflow-y: auto; background: #181818; border-radius: 8px; padding: 12px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 8px 12px; border-radius: 8px; max-width: 85%; word-wrap: break-word; font-size: 14px; line-height: 1.4; }
        .user-msg { background: #007bff; align-self: flex-end; color: white; }
        .ai-msg { background: #2a2a2a; align-self: flex-start; color: #e0e0e0; border: 1px solid #333; }
        .input-box { display: flex; gap: 8px; }
        .input-box input { flex: 1; }
    </style>
</head>
<body>

    <div class="header">
        <label>API КЛЮЧ OPENROUTER:</label>
        <input type="password" id="apiKey" placeholder="sk-or-v1-..." onchange="saveSettings()">

        <label>ВЫБОР БЕСПЛАТНОЙ МОДЕЛИ:</label>
        <select id="modelSelect" onchange="saveSettings()">
            <option value="openrouter/free">Авто-выбор (OpenRouter Free)</option>
            <option value="qwen/qwen-2.5-coder-32b-instruct:free">Qwen 2.5 Coder 32B (Для кода)</option>
            <option value="deepseek/deepseek-r1:free">DeepSeek R1 (Рассуждения)</option>
            <option value="meta-llama/llama-3.3-70b-instruct:free">Llama 3.3 70B (Универсальная)</option>
        </select>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="msg ai-msg">Привет! Введи свой API-ключ OpenRouter выше и напиши запрос.</div>
    </div>

    <div class="input-box">
        <input type="text" id="userInput" placeholder="Введите сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button id="sendBtn" onclick="sendMessage()">➔</button>
    </div>

    <script>
        // Загрузка сохраненных настроек при старте
        document.addEventListener("DOMContentLoaded", () => {
            const savedKey = localStorage.getItem("or_api_key");
            const savedModel = localStorage.getItem("or_model");
            if (savedKey) document.getElementById("apiKey").value = savedKey;
            if (savedModel) document.getElementById("modelSelect").value = savedModel;
        });

        function saveSettings() {
            localStorage.setItem("or_api_key", document.getElementById("apiKey").value.trim());
            localStorage.setItem("or_model", document.getElementById("modelSelect").value);
        }

        async function sendMessage() {
            const apiKey = document.getElementById("apiKey").value.trim();
            const model = document.getElementById("modelSelect").value;
            const inputField = document.getElementById("userInput");
            const sendBtn = document.getElementById("sendBtn");
            const prompt = inputField.value.trim();

            if (!apiKey) {
                alert("Пожалуйста, введите API-ключ OpenRouter!");
                return;
            }
            if (!prompt) return;

            saveSettings();
            appendMessage(prompt, "user-msg");
            inputField.value = "";
            sendBtn.disabled = true;

            const aiMsgDiv = appendMessage("Печатает...", "ai-msg");

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [{ role: "user", content: prompt }]
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    aiMsgDiv.innerText = data.choices[0].message.content;
                } else {
                    aiMsgDiv.innerText = "Ошибка: " + (data.error?.message || response.statusText);
                }
            } catch (err) {
                aiMsgDiv.innerText = "Ошибка сети: " + err.message;
            } finally {
                sendBtn.disabled = false;
                scrollToBottom();
            }
        }

        function appendMessage(text, className) {
            const chatBox = document.getElementById("chatBox");
            const msgDiv = document.createElement("div");
            msgDiv.className = `msg ${className}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            scrollToBottom();
            return msgDiv;
        }

        function scrollToBottom() {
            const chatBox = document.getElementById("chatBox");
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
