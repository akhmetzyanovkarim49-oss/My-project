<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG Messenger Mobile</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, Roboto, sans-serif; }
        body { background: #0e1621; color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #17212b; padding: 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #0e1621; }
        .tab-btn { background: none; border: none; color: #7f91a4; font-size: 16px; font-weight: bold; cursor: pointer; }
        .tab-btn.active { color: #64b5ef; border-bottom: 2px solid #64b5ef; }
        .screen { display: none; flex-direction: column; flex: 1; overflow: hidden; }
        .screen.active { display: flex; }
        .chat-item { background: #17212b; padding: 15px; margin-bottom: 1px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .chat-item:active { background: #2b5278; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #242f3d; background: #17212b; color: #fff; font-size: 16px; outline: none; margin-bottom: 10px; }
        button.action-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #2b5278; color: #fff; font-weight: bold; font-size: 16px; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 10px 14px; border-radius: 12px; font-size: 15px; max-width: 80%; word-break: break-word; }
        .incoming { background: #182533; align-self: flex-start; }
        .outgoing { background: #2b5278; align-self: flex-end; }
        .input-area { display: flex; gap: 10px; padding: 10px; background: #17212b; }
        .profile-card { background: #17212b; border-radius: 16px; padding: 20px; text-align: center; margin: 20px; border: 1px solid #242f3d; }
        .profile-id { font-size: 36px; font-weight: bold; color: #64b5ef; letter-spacing: 3px; font-family: monospace; margin: 10px 0; }
    </style>
</head>
<body>
    <header>
        <button class="tab-btn active" onclick="switchTab('chats')">💬 Чаты</button>
        <button class="tab-btn" onclick="switchTab('profile')">👤 Профиль</button>
    </header>

    <!-- ВКЛАДКА ЧАТОВ -->
    <div id="chats-screen" class="screen active">
        <div style="padding: 10px;">
            <input type="number" id="new-code-input" placeholder="Введите 6 цифр ID друга...">
            <button class="action-btn" onclick="addNewChat()">+ Добавить чат по ID</button>
        </div>
        <div id="chat-list" style="flex: 1; overflow-y: auto;"></div>
    </div>

    <!-- ВКЛАДКА ОКНА СООБЩЕНИЙ -->
    <div id="messages-screen" class="screen">
        <div style="background: #17212b; padding: 10px; display: flex; align-items: center; gap: 10px;">
            <button style="background:none; border:none; color:#64b5ef; font-size:18px;" onclick="switchTab('chats')">◄ Назад</button>
            <span id="active-chat-title" style="font-weight: bold;">Чат</span>
        </div>
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendMsg()">
            <button class="action-btn" style="width: 50px;" onclick="sendMsg()">➔</button>
        </div>
    </div>

    <!-- ВКЛАДКА ПРОФИЛЯ -->
    <div id="profile-screen" class="screen">
        <div class="profile-card">
            <div style="font-size: 60px;">👤</div>
            <div style="color: #7f91a4; font-size: 14px;">ВАШ ПОСТОЯННЫЙ ID</div>
            <div id="my-profile-id" class="profile-id">------</div>
            <div style="color: #7f91a4; font-size: 13px;">Передайте этот ID другу или введите его на ПК для связи.</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAE06gMQSdQsHO3wqVDhRZM20FQsXwR7Dg",
            authDomain: "mesanger-1157b.firebaseapp.com",
            projectId: "mesanger-1157b",
            storageBucket: "mesanger-1157b.firebasestorage.app",
            messagingSenderId: "403397305101",
            appId: "1:403397305101:web:ea7e5d5dd076af9e754644",
            databaseURL: "https://mesanger-1157b-default-rtdb.firebaseio.com"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Получаем или генерируем постоянный ID
        let myUserId = localStorage.getItem('my_messenger_id');
        if (!myUserId) {
            myUserId = Math.floor(100000 + Math.random() * 900000).toString();
            localStorage.setItem('my_messenger_id', myUserId);
        }
        document.getElementById('my-profile-id').innerText = myUserId;

        let savedChats = JSON.parse(localStorage.getItem('saved_chats') || '{}');
        let currentRoom = null;
        let listenerRef = null;

        function renderChatList() {
            const list = document.getElementById('chat-list');
            list.innerHTML = '';
            for (let code in savedChats) {
                const div = document.createElement('div');
                div.className = 'chat-item';
                div.innerHTML = `<div><b>${savedChats[code]}</b><br><small style="color:#7f91a4">ID: ${code}</small></div> ➔`;
                div.onclick = () => openChat(code);
                list.appendChild(div);
            }
        }

        function addNewChat() {
            const code = document.getElementById('new-code-input').value.trim();
            if (code.length === 6) {
                savedChats[code] = "Собеседник [" + code + "]";
                localStorage.setItem('saved_chats', JSON.stringify(savedChats));
                document.getElementById('new-code-input').value = '';
                renderChatList();
            }
        }

        function openChat(code) {
            currentRoom = code;
            document.getElementById('active-chat-title').innerText = savedChats[code];
            document.getElementById('messages').innerHTML = '';
            switchTab('messages');

            if (listenerRef) listenerRef.off();

            listenerRef = db.ref('chats/' + currentRoom);
            listenerRef.on('child_added', (snapshot) => {
                const data = snapshot.val();
                const type = data.sender === myUserId ? 'outgoing' : 'incoming';
                appendMessage(data.text, type);
            });
        }

        function sendMsg() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (text && currentRoom) {
                db.ref('chats/' + currentRoom).push({ sender: myUserId, text: text, time: Date.now() });
                input.value = '';
            }
        }

        function appendMessage(text, type) {
            const container = document.getElementById('messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${type}`;
            msgDiv.innerText = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function switchTab(tab) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (tab === 'chats') {
                document.getElementById('chats-screen').classList.add('active');
                renderChatList();
            } else if (tab === 'profile') {
                document.getElementById('profile-screen').classList.add('active');
            } else if (tab === 'messages') {
                document.getElementById('messages-screen').classList.add('active');
            }
        }

        renderChatList();
    </script>
</body>
</html>
