<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>P2P Messenger</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; flex-direction: column; height: 100vh; margin: 0; padding: 10px; }
        #setup { display: flex; flex-direction: column; gap: 10px; }
        #chat { display: none; flex-direction: column; height: 100%; }
        #messages { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 10px; border-radius: 10px; }
        .msg { padding: 8px; margin: 5px; background: #333; border-radius: 10px; width: fit-content; }
        .my-msg { background: #0084ff; align-self: flex-end; margin-left: auto; }
        textarea { height: 80px; width: 100%; }
    </style>
</head>
<body>

    <!-- Экран настройки соединения -->
    <div id="setup">
        <h3>1. Скопируй этот код и отправь на ПК:</h3>
        <textarea id="local-sdp" readonly></textarea>
        
        <h3>2. Вставь код ответа с ПК сюда:</h3>
        <textarea id="remote-sdp" placeholder="Вставь сюда ответ с ПК"></textarea>
        <button onclick="connect()">Соединиться</button>
    </div>

    <!-- Экран чата -->
    <div id="chat">
        <div id="messages"></div>
        <div style="display: flex;">
            <input type="text" id="msg-input" style="flex: 1;" placeholder="Сообщение...">
            <button onclick="sendMsg()">></button>
        </div>
    </div>

    <script>
        const pc = new RTCPeerConnection({
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        });
        let dc = pc.createDataChannel("chat");

        // 1. Создаем Offer (код для передачи на ПК)
        pc.createOffer().then(offer => {
            pc.setLocalDescription(offer);
            document.getElementById('local-sdp').value = JSON.stringify(offer);
        });

        // 2. Обработка входящих данных
        dc.onopen = () => {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('chat').style.display = 'flex';
        };
        dc.onmessage = (e) => appendMessage(e.data, false);

        // 3. Подключение (вставка кода с ПК)
        function connect() {
            const answer = JSON.parse(document.getElementById('remote-sdp').value);
            pc.setRemoteDescription(new RTCSessionDescription(answer));
        }

        // 4. Отправка сообщений
        function sendMsg() {
            const input = document.getElementById('msg-input');
            dc.send(input.value);
            appendMessage(input.value, true);
            input.value = '';
        }

        function appendMessage(text, isMe) {
            const div = document.createElement('div');
            div.className = 'msg ' + (isMe ? 'my-msg' : '');
            div.innerText = text;
            document.getElementById('messages').appendChild(div);
        }
    </script>
</body>
</html>
