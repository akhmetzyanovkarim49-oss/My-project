<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d0d0d; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; padding: 10px; }
        
        .header { background: #1a1a1a; padding: 10px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #333; }
        label { font-size: 10px; color: #888; font-weight: bold; text-transform: uppercase; }
        
        .row { display: flex; gap: 8px; margin-top: 5px; }
        input, select { background: #000; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 6px; font-size: 14px; outline: none; flex: 1; }
        
        button { background: #222; color: #fff; border: 1px solid #444; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        button:active { background: #444; }
        .btn-blue { background: #007bff; border: none; font-weight: bold; }
        .btn-red { background: #8b0000; border: none; }

        .chat-box { flex: 1; overflow-y: auto; background: #121212; border-radius: 12px; padding: 15px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 12px; border: 1px solid #222; }
        .msg { padding: 10px 14px; border-radius: 10px; max-width: 92%; font-size: 14px; line-height: 1.6; word-wrap: break-word; position: relative; }
        .user-msg { background: #0056b3; align-self: flex-end; color: white; }
        .ai-msg { background: #1e1e1e; align-self: flex-start; border: 1px solid #333; color: #e0e0e0; }
        
        pre { background: #000; padding: 10px; border-radius: 6px; overflow-x: auto; margin: 8px 0; border: 1px solid #333; position: relative; }
        code { font-family: monospace; }
        
        .input-box { display: flex; gap: 8px; }
    </style>
</head>
<body>

    <div class="header">
        <label>API КЛЮЧ:</label>
        <div class="row">
            <input type="password" id="apiKey" placeholder="sk-or-v1-..." oninput="saveKey()">
        </div>
        
        <label style="margin-top: 8px;">МОДЕЛЬ:</label>
        <div class="row">
            <select id="modelSelect">
                <option value="qwen/qwen-2.5-coder-32b-instruct:free">Qwen 2.5 Coder 32B (Для кода)</option>
                <option value="openai/gpt-oss-20b:free">GPT-OSS 20B (OpenAI Free)</option>
                <option value="meta-llama/llama-3.3-70b-instruct:free">Llama 3.3 70B</option>
                <option value="deepseek/deepseek-r1:free">DeepSeek R1</option>
            </select>
            <button class="btn-red" onclick="resetConversation()">🗑️ Сброс</button>
        </div>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="msg ai-msg">Привет! Включен стриминг ответов. Задавай вопрос.</div>
    </div>

    <div class="input-box">
        <input type="text" id="userInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button id="sendBtn" class="btn-blue" onclick="sendMessage()">➤</button>
    </div>

    <script>
        let conversationHistory = [];

        document.addEventListener("DOMContentLoaded", () => {
            const savedKey = localStorage.getItem("or_api_key");
            if (savedKey) document.getElementById('apiKey').value = savedKey;
            resetConversation();
        });

        function saveKey() {
            localStorage.setItem("or_api_key", document.getElementById('apiKey').value.trim());
        }

        function resetConversation() {
            conversationHistory = [{ role: "system", content: "Ты опытный Python-разработчик и помощник. Пиши рабочий код." }];
            document.getElementById('chatBox').innerHTML = '<div class="msg ai-msg">Чат очищен.</div>';
            saveKey();
        }

        async function sendMessage() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const selectedModel = document.getElementById('modelSelect').value;
            const input = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const prompt = input.value.trim();
            
            if(!apiKey) return alert("Введите API ключ!");
            if(!prompt) return;

            if(conversationHistory.length === 0) resetConversation();

            conversationHistory.push({ role: "user", content: prompt });
            appendMessage(prompt, "user-msg");
            input.value = "";
            sendBtn.disabled = true;

            const aiDiv = appendMessage("Thinking...", "ai-msg");
            aiDiv.innerText = ""; // очищаем для стрима

            // Ограничиваем историю последними 6 сообщениями, чтобы не перегружать запрос
            const recentMessages = conversationHistory.slice(-6);

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "HTTP-Referer": "https://github.com",
                        "X-Title": "My AI Assistant",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: selectedModel,
                        messages: recentMessages,
                        stream: true // Потоковая передача!
                    })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error ? errData.error.message : response.status);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let fullText = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split("\n");

                    for (const line of lines) {
                        if (line.startsWith("data: ")) {
                            const jsonStr = line.replace("data: ", "").trim();
                            if (jsonStr === "[DONE]") break;

                            try {
                                const parsed = JSON.parse(jsonStr);
                                const content = parsed.choices[0]?.delta?.content || "";
                                fullText += content;

                                if (window.marked) {
                                    aiDiv.innerHTML = marked.parse(fullText);
                                    if (window.hljs) hljs.highlightAll();
                                } else {
                                    aiDiv.innerText = fullText;
                                }
                                scrollToBottom();
                            } catch (e) {
                                // пропуск некорректных чанков
                            }
                        }
                    }
                }

                conversationHistory.push({ role: "assistant", content: fullText });

            } catch (e) {
                aiDiv.innerText = "🌐 Ошибка: " + e.message;
                conversationHistory.pop();
            } finally {
                sendBtn.disabled = false;
                scrollToBottom();
            }
        }

        function appendMessage(text, className) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `msg ${className}`;
            div.innerText = text;
            chatBox.appendChild(div);
            scrollToBottom();
            return div;
        }

        function scrollToBottom() {
            const chatBox = document.getElementById('chatBox');
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
