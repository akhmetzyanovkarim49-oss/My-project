<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant Pro</title>
    <!-- Маркдаун и подсветка кода -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d0d0d; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; padding: 10px; }
        
        .header { background: #1a1a1a; padding: 10px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #333; }
        label { font-size: 10px; color: #888; font-weight: bold; text-transform: uppercase; }
        
        .row { display: flex; gap: 8px; margin-top: 5px; }
        input, select, textarea { background: #000; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 6px; font-size: 14px; outline: none; flex: 1; }
        
        button { background: #222; color: #fff; border: 1px solid #444; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        button:active { background: #444; }
        .btn-blue { background: #007bff; border: none; }
        .btn-red { background: #8b0000; border: none; }

        .chat-box { flex: 1; overflow-y: auto; background: #121212; border-radius: 12px; padding: 15px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 12px; border: 1px solid #222; }
        .msg { padding: 10px 14px; border-radius: 10px; max-width: 92%; font-size: 14px; line-height: 1.6; }
        .user-msg { background: #0056b3; align-self: flex-end; }
        .ai-msg { background: #1e1e1e; align-self: flex-start; border: 1px solid #333; }
        
        /* Подсветка кода */
        pre { background: #000; padding: 10px; border-radius: 6px; overflow-x: auto; margin: 5px 0; }
        code { font-family: 'Courier New', Courier, monospace; }
        
        .input-box { display: flex; gap: 8px; }
    </style>
</head>
<body>

    <div class="header">
        <label>API КЛЮЧ:</label>
        <div class="row">
            <input type="text" id="apiKey" placeholder="sk-or-v1-...">
        </div>
        
        <label style="margin-top: 10px;">СИСТЕМНАЯ РОЛЬ:</label>
        <div class="row">
            <select id="sysRole" onchange="resetConversation()">
                <option value="Ты — полезный ИИ-ассистент.">Универсальный помощник</option>
                <option value="Ты — опытный Python-разработчик. Пиши только чистый код, минимум слов.">Python Разработчик</option>
                <option value="Ты — строгий репетитор. Объясняй всё просто, с примерами.">Репетитор</option>
                <option value="Ты — переводчик с любого языка на русский.">Переводчик</option>
            </select>
            <button class="btn-red" onclick="resetConversation()">🗑️ Сброс</button>
        </div>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="msg ai-msg">Привет! Введи ключ, выбери роль и начнем.</div>
    </div>

    <div class="input-box">
        <input type="text" id="userInput" placeholder="Сообщение...">
        <button class="btn-blue" onclick="sendMessage()">➤</button>
    </div>

    <script>
        let conversationHistory = []; // Память диалога

        // Инициализация подсветки кода
        marked.setOptions({
            highlight: (code, lang) => hljs.highlightAuto(code).value
        });

        function resetConversation() {
            const role = document.getElementById('sysRole').value;
            conversationHistory = [{ role: "system", content: role }];
            document.getElementById('chatBox').innerHTML = '<div class="msg ai-msg">Чат очищен. Новая роль: ' + document.getElementById('sysRole').options[document.getElementById('sysRole').selectedIndex].text + '</div>';
            localStorage.setItem("or_api_key", document.getElementById('apiKey').value);
        }

        async function sendMessage() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const input = document.getElementById('userInput');
            const prompt = input.value.trim();
            
            if(!apiKey) return alert("Введите ключ!");
            if(!prompt) return;

            // Если история пуста (после сброса), добавляем системную роль
            if(conversationHistory.length === 0) resetConversation();

            conversationHistory.push({ role: "user", content: prompt });
            appendMessage(prompt, "user-msg");
            input.value = "";

            const aiDiv = appendMessage("...", "ai-msg");

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "openrouter/free",
                        messages: conversationHistory
                    })
                });

                const data = await response.json();
                const reply = data.choices[0].message.content;

                conversationHistory.push({ role: "assistant", content: reply });
                aiDiv.innerHTML = marked.parse(reply);
                document.getElementById('chatBox').scrollTop = 9999;

            } catch (e) {
                aiDiv.innerText = "Ошибка: " + e.message;
            }
        }

        function appendMessage(text, className) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `msg ${className}`;
            div.innerHTML = text; // Упрощенно
            chatBox.appendChild(div);
            return div;
        }
    </script>
</body>
</html>
