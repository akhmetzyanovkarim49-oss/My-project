<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Discord Mobile Pro</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; transition: all 0.2s ease; }
        html, body { height: 100%; width: 100%; background: #1e1f22; color: #dbdee1; overflow: hidden; }
        body { display: flex; flex-direction: column; padding: 10px; gap: 10px; }

        header { background: #2b2d31; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: space-around; border: 1px solid #1f2023; }
        .tab-btn { background: none; border: none; color: #949ba4; font-size: 14px; font-weight: bold; padding: 8px 16px; cursor: pointer; }
        .tab-btn.active { color: #fff; border-bottom: 2px solid #5865f2; }

        .screen { display: none; flex-direction: column; flex: 1; overflow: hidden; gap: 10px; }
        .screen.active { display: flex; }

        /* КАРТОЧКИ-ПУЗЫРИ */
        .bubble-card { background: #2b2d31; border-radius: 16px; border: 1px solid #1f2023; padding: 12px; display: flex; flex-direction: column; }

        /* СПИСОК ЧАТОВ */
        .input-card { display: flex; gap: 8px; }
        input.code-input { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #1e1f22; background: #1e1f22; color: #fff; outline: none; }
        button.add-btn { background: #5865f2; color: #fff; border: none; border-radius: 10px; padding: 10px 16px; font-weight: bold; }
        button:active { transform: scale(0.96); }

        #chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .chat-item { background: #1e1f22; padding: 10px 14px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .chat-info { flex: 1; display: flex; align-items: center; gap: 10px; }
        .chat-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; }

        /* ОКТНО ЧАТА */
        .chat-header { background: #2b2d31; height: 48px; border-radius: 14px; padding: 0 14px; display: flex; align-items: center; gap: 10px; border: 1px solid #1f2023; }
        .back-btn { background: none; border: none; color: #5865f2; font-size: 20px; }

        #messages-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .discord-msg { display: flex; gap: 10px; font-size: 13px; }
        .msg-content { flex: 1; }
        .msg-meta { font-size: 12px; font-weight: bold; }
        .msg-meta.my { color: #5865f2; }
        .msg-meta.other { color: #57f287; }
        .msg-timestamp { font-size: 9px; color: #949ba4; font-weight: normal; margin-left: 6px; }

        /* ПУЗЫРЬ ВВОДА */
        .input-area { background: #2b2d31; padding: 8px 12px; border-radius: 16px; display: flex; gap: 8px; border: 1px solid #1f2023; align-items: center; }
        .msg-input { flex: 1; padding: 10px; border-radius: 10px; border: none; background: #1e1f22; color: #fff; outline: none; }
        .send-btn { background: #5865f2; color: #fff; border: none; border-radius: 10px; width: 42px; height: 38px; font-size: 16px; }

        /* ПРОФИЛЬ МОДАЛКА И КАРТОЧКА */
        .profile-card { background: #2b2d31; border-radius: 16px; padding: 20px; text-align: center; border: 1px solid #1f2023; }
        .profile-avatar { background: #5865f2; width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 10px; }
        .profile-id { font-size: 28px; font-weight: bold; color: #23a55a; font-family: monospace; }

        /* ВСТРОЕННЫЙ МАКЕТ МОДАЛКИ */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); z-index: 100; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #2b2d31; border-radius: 16px; border: 1px solid #5865f2; padding: 20px; width: 85%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; }
    </style>
</head>
<body>
    <header id="main-header">
        <button class="tab-btn active" onclick="switchTab('chats')">💬 Чат</button>
        <button class="tab-btn" onclick="switchTab('profile')">👤 Профиль</button>
    </header>

    <div id="chats-screen" class="screen active">
        <div class="bubble-card input-card">
            <input type="number" id="new-code-input" class="code-input" placeholder="Введите 6 цифр ID...">
            <button class="add-btn" onclick="addNewChat()">+ Чат</button>
        </div>
        <div class="bubble-card" style="flex: 1;">
            <div id="chat-list"></div>
        </div>
    </div>

    <div id="messages-screen" class="screen">
        <div class="chat-header">
            <button class="back-btn" onclick="switchTab('chats')">◄</button>
            <div id="header-avatar-mini" class="chat-avatar" style="width: 32px; height: 32px; font-size: 13px;">@</div>
            <div>
                <div id="active-chat-title" style="font-weight: bold; font-size: 14px; color: #fff;">@ Пользователь</div>
                <div id="active-chat-sub" style="color: #23a55a; font-size: 10px;">в сети</div>
            </div>
        </div>

        <div class="bubble-card" style="flex: 1;">
            <div id="messages-container"></div>
        </div>

        <div class="input-area">
            <input type="text" id="msg-input" class="msg-input" placeholder="Написать сообщение..." onkeydown="if(event.key==='Enter') sendMsg()">
            <button class="send-btn" onclick="sendMsg()">➔</button>
        </div>
    </div>

    <div id="profile-screen" class="screen">
        <div class="profile-card">
            <div class="profile-avatar">👤</div>
            <div style="color: #949ba4; font-size: 12px;">НИКНЕЙМ</div>
            <div id="my-profile-name" style="font-size: 20px; font-weight: bold; color: #fff; margin-bottom: 10px;">Мой Аккаунт</div>
            <div style="color: #949ba4; font-size: 12px;">ПОСТОЯННЫЙ ID</div>
            <div id="my-profile-id" class="profile-id">------</div>
            <button class="add-btn" style="margin-top: 15px; width: 100%;" onclick="showSettingsModal()">⚙️ Изменить Никнейм</button>
        </div>
    </div>

    <!-- ВСТРОЕННАЯ МОДАЛКА -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-box">
            <div id="modal-title" style="font-weight: bold; font-size: 16px; color: #fff;">Заголовок</div>
            <input type="text" id="modal-input" class="code-input" style="width: 100%;">
            <div style="display: flex; gap: 8px; justify-content: flex-end;">
                <button class="add-btn" style="background: #4e5058;" onclick="hideModal()">Отмена</button>
                <button id="modal-confirm-btn" class="add-btn">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAE06gMQSdQsHO3wqVDhRZM20FQsXwR7Dg",
            authDomain: "mesanger-1157b.firebaseapp.com",
            projectId: "mesanger-1157b",
            storageBucket: "mesanger-1157b.firebasestorage.app",
            messagingSenderId: "403397305101",
            appId: "1:403397305101:web:ea7e5d5dd076af9e754644",
            databaseURL: "https://mesanger-1157b-default-rtdb.firebaseio.com"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const AVATAR_COLORS = ["#5865f2", "#57f287", "#fee75c", "#eb459e", "#ed4245", "#9b59b6", "#1abc9c"];

        function getAvatarColor(senderId) {
            let hash = 0; const str = String(senderId);
            for (let i = 0; i < str.length; i++) hash += str.charCodeAt(i);
            return AVATAR_COLORS[hash % AVATAR_COLORS.length];
        }

        let myUserId = localStorage.getItem('my_messenger_id');
        if (!myUserId || myUserId.length !== 6) {
            myUserId = Math.floor(100000 + Math.random() * 900000).toString();
            localStorage.setItem('my_messenger_id', myUserId);
        }
        document.getElementById('my-profile-id').innerText = myUserId;

        let myUserName = localStorage.getItem('my_messenger_name') || 'Мой Аккаунт';
        document.getElementById('my-profile-name').innerText = myUserName;

        let savedChats = JSON.parse(localStorage.getItem('saved_chats') || '{}');
        let currentRoom = null;
        let activeListener = null;

        function showSettingsModal() {
            document.getElementById('modal-title').innerText = "Изменить Никнейм";
            const input = document.getElementById('modal-input');
            input.value = myUserName;
            document.getElementById('modal-confirm-btn').onclick = () => {
                if (input.value.trim()) {
                    myUserName = input.value.trim();
                    localStorage.setItem('my_messenger_name', myUserName);
                    document.getElementById('my-profile-name').innerText = myUserName;
                    hideModal();
                }
            };
            document.getElementById('modal-overlay').classList.add('active');
        }

        function hideModal() {
            document.getElementById('modal-overlay').classList.remove('active');
        }

        function renderChatList() {
            const list = document.getElementById('chat-list');
            list.innerHTML = '';
            for (let code in savedChats) {
                const name = savedChats[code];
                const color = getAvatarColor(code);

                const div = document.createElement('div');
                div.className = 'chat-item';
                div.innerHTML = `
                    <div class="chat-info" onclick="openChat('${code}')">
                        <div class="chat-avatar" style="background-color: ${color}">${name ? name[0].toUpperCase() : '@'}</div>
                        <div>
                            <div style="font-weight: bold; font-size: 13px; color: #f2f3f5;">${name}</div>
                            <div style="color:#949ba4; font-size: 10px;">ID: ${code}</div>
                        </div>
                    </div>
                `;
                list.appendChild(div);
            }
        }

        function addNewChat() {
            const code = document.getElementById('new-code-input').value.trim();
            if (code.length === 6) {
                savedChats[code] = "Пользователь " + code;
                localStorage.setItem('saved_chats', JSON.stringify(savedChats));
                document.getElementById('new-code-input').value = '';
                renderChatList();
            }
        }

        function openChat(code) {
            currentRoom = code;
            const name = savedChats[code];
            document.getElementById('active-chat-title').innerText = "@ " + name;
            document.getElementById('active-chat-sub').innerText = "ID: " + code + " • в сети";

            const miniAv = document.getElementById('header-avatar-mini');
            miniAv.innerText = name ? name[0].toUpperCase() : '@';
            miniAv.style.backgroundColor = getAvatarColor(code);

            document.getElementById('messages-container').innerHTML = '';
            switchTab('messages');

            if (activeListener) activeListener.off();

            activeListener = db.ref('chats/' + currentRoom);
            activeListener.on('child_added', (snapshot) => {
                const data = snapshot.val();
                const isMy = data.sender === myUserId;
                const timeStr = data.time ? new Date(data.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
                appendDiscordMessage(data.sender, data.text, timeStr, isMy);
            });
        }

        function sendMsg() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (text && currentRoom) {
                db.ref('chats/' + currentRoom).push({ sender: myUserId, text: text, time: Date.now() });
                input.value = '';
            }
        }

        function appendDiscordMessage(senderId, text, timeStr, isMy) {
            const container = document.getElementById('messages-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'discord-msg';

            const color = isMy ? '#5865f2' : getAvatarColor(senderId);
            const title = isMy ? myUserName : `Пользователь [${senderId}]`;
            const titleClass = isMy ? 'my' : 'other';

            msgDiv.innerHTML = `
                <div class="chat-avatar" style="background-color: ${color}; width: 32px; height: 32px; font-size: 13px;">${title[0]}</div>
                <div class="msg-content">
                    <div class="msg-meta ${titleClass}">${title}<span class="msg-timestamp">Сегодня в ${timeStr}</span></div>
                    <div style="color: #dbdee1;">${text}</div>
                </div>
            `;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        db.ref('chats').on('child_added', (roomSnapshot) => {
            const roomCode = roomSnapshot.key;
            roomSnapshot.ref.on('child_added', (msgSnapshot) => {
                const msg = msgSnapshot.val();
                if (msg.sender !== myUserId && !savedChats[roomCode]) {
                    savedChats[roomCode] = "Пользователь " + roomCode;
                    localStorage.setItem('saved_chats', JSON.stringify(savedChats));
                    renderChatList();
                }
            });
        });

        function switchTab(tab) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            const mainHeader = document.getElementById('main-header');

            if (tab === 'chats') {
                mainHeader.style.display = 'flex';
                document.getElementById('chats-screen').classList.add('active');
                renderChatList();
            } else if (tab === 'profile') {
                mainHeader.style.display = 'flex';
                document.getElementById('profile-screen').classList.add('active');
            } else if (tab === 'messages') {
                mainHeader.style.display = 'none';
                document.getElementById('messages-screen').classList.add('active');
            }
        }

        renderChatList();
    </script>
</body>
</html>
