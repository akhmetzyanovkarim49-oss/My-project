<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Messenger Мобильный</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f0f10; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; }
        .card { background: #1a1a1e; border: 1px solid #2a2a2e; border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .my-code { font-size: 38px; font-weight: bold; color: #0084ff; letter-spacing: 4px; font-family: monospace; margin-top: 5px; }
        input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #3a3a3c; background: #2c2c2e; color: #fff; font-size: 22px; text-align: center; margin-bottom: 12px; outline: none; letter-spacing: 2px; }
        button { width: 100%; padding: 14px; border-radius: 12px; border: none; background: #0084ff; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
        #chat-screen { display: none; flex-direction: column; height: 100%; }
        #messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px; border: 1px solid #2a2a2e; border-radius: 12px; }
        .msg { padding: 10px 14px; border-radius: 14px; font-size: 15px; max-width: 80%; word-break: break-word; }
        .incoming { background: #2c2c2e; align-self: flex-start; }
        .outgoing { background: #0084ff; align-self: flex-end; }
        .input-area { display: flex; gap: 10px; margin-top: 15px; }
    </style>
</head>
<body>
    <div id="main-screen">
        <div class="card">
            <div style="color: #8e8e93; font-size: 13px;">ТВОЙ КОД ДЛЯ ПОДКЛЮЧЕНИЯ</div>
            <div id="my-code" class="my-code">------</div>
        </div>
        <div class="card">
            <div style="color: #8e8e93; font-size: 13px; margin-bottom: 10px;">ВВЕДИ 6 ЦИФР С ПК ИЛИ ДРУГА</div>
            <input type="number" id="friend-code" placeholder="000000" oninput="if(this.value.length > 6) this.value = this.value.slice(0, 6);">
            <button onclick="joinRoom()">Войти в чат</button>
        </div>
    </div>

    <div id="chat-screen">
        <h3>Чат: [<span id="connected-id">------</span>]</h3>
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="Сообщение..." style="font-size: 16px; text-align: left;" onkeydown="if(event.key==='Enter') sendMsg()">
            <button onclick="sendMsg()" style="width: 60px;">➔</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAE06gMQSdQsHO3wqVDhRZM20FQsXwR7Dg",
            authDomain: "mesanger-1157b.firebaseapp.com",
            projectId: "mesanger-1157b",
            storageBucket: "mesanger-1157b.firebasestorage.app",
            messagingSenderId: "403397305101",
            appId: "1:403397305101:web:ea7e5d5dd076af9e754644",
            measurementId: "G-7X0C3B7XH3",
            databaseURL: "https://mesanger-1157b-default-rtdb.firebaseio.com"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const myUserId = 'phone_' + Math.floor(Math.random() * 10000);
        const roomCode = Math.floor(100000 + Math.random() * 900000).toString();
        document.getElementById('my-code').innerText = roomCode;

        let activeRoom = null;

        function joinRoom() {
            const inputCode = document.getElementById('friend-code').value.trim();
            activeRoom = inputCode.length === 6 ? inputCode : roomCode;

            document.getElementById('connected-id').innerText = activeRoom;
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';

            db.ref('chats/' + activeRoom).on('child_added', (snapshot) => {
                const data = snapshot.val();
                const type = data.sender === myUserId ? 'outgoing' : 'incoming';
                appendMessage(data.text, type);
            });
        }

        function sendMsg() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (text !== '' && activeRoom) {
                db.ref('chats/' + activeRoom).push({
                    sender: myUserId,
                    text: text,
                    time: Date.now()
                });
                input.value = '';
            }
        }

        function appendMessage(text, type) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${type}`;
            msgDiv.innerText = text;
            const container = document.getElementById('messages');
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
