<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger Mobile</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div id="app">
        <!-- Шапка -->
        <header>
            <h1>Messenger</h1>
            <span id="my-id-display">Мой ID: ...</span>
        </header>

        <!-- Поиск / Добавление чата -->
        <div class="chat-search">
            <input type="text" id="target-id-input" placeholder="Введите ID собеседника">
            <button onclick="startNewChat()">+ Чат</button>
            <button onclick="makeCall()" class="call-btn">📞 Звонок</button>
        </div>

        <!-- Окно сообщений -->
        <div id="chat-box" class="chat-box"></div>

        <!-- Форма отправки -->
        <div class="input-box">
            <input type="text" id="message-input" placeholder="Сообщение...">
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <!-- Модульные скрипты -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/call.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
