<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mobile Style</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        body { background: #0e1621; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background: #17212b; padding: 12px 16px; display: flex; align-items: center; justify-content: space-around; border-bottom: 1px solid #0e1621; }
        .tab-btn { background: none; border: none; color: #7f91a4; font-size: 15px; font-weight: bold; cursor: pointer; padding: 6px 12px; }
        .tab-btn.active { color: #64b5ef; border-bottom: 2px solid #64b5ef; }
        
        .screen { display: none; flex-direction: column; flex: 1; overflow: hidden; }
        .screen.active { display: flex; }
        
        /* ЭКРАН ЧАТОВ */
        .input-card { padding: 12px; background: #17212b; border-bottom: 1px solid #0e1621; display: flex; gap: 8px; }
        input.code-input { flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid #242f3d; background: #0e1621; color: #fff; font-size: 14px; outline: none; }
        button.add-btn { background: #2b5278; color: #fff; border: none; border-radius: 10px; padding: 10px 14px; font-weight: bold; font-size: 14px; cursor: pointer; }
        
        .chat-item { background: #17212b; padding: 14px 16px; border-bottom: 1px solid #0e1621; display: flex; justify-content: space-between; align-items: center; }
        .chat-item:active { background: #202b36; }
        .chat-info { flex: 1; display: flex; align-items: center; gap: 12px; }
        .chat-avatar { background: #242f3d; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .delete-btn { background: #e53935; color: #fff; border: none; border-radius: 8px; width: 32px; height: 32px; font-weight: bold; cursor: pointer; }
        
        /* ЭКРАН СООБЩЕНИЙ (TG BUBBLES) */
        .chat-header { background: #17212b; padding: 10px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #0e1621; }
        .back-btn { background: none; border: none; color: #64b5ef; font-size: 20px; cursor: pointer; }
        
        #messages { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; background: #0e1621; }
        
        .msg-bubble { max-width: 80%; padding: 8px 12px; font-size: 14px; line-height: 1.3; word-break: break-word; display: flex; flex-direction: column; }
        .msg-bubble.outgoing { 
            background: #2b5278; color: #fff; align-self: flex-end; 
            border-top-left-radius: 12px; border-top-right-radius: 12px; border-bottom-left-radius: 12px; border-bottom-right-radius: 3px; 
        }
        .msg-bubble.incoming { 
            background: #182533; color: #fff; align-self: flex-start; 
            border-top-left-radius: 12px; border-top-right-radius: 12px; border-bottom-left-radius: 3px; border-bottom-right-radius: 12px; 
        }
        .msg-time { font-size: 10px; color: rgba(255, 255, 255, 0.5); align-self: flex-end; margin-top: 4px; }
        
        .input-area { display: flex; gap: 8px; padding: 10px 12px; background: #17212b; border-top: 1px solid #0e1621; }
        .msg-input { flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid #242f3d; background: #0e1621; color: #fff; font-size: 15px; outline: none; }
        .send-btn { background: #2b5278; color: #fff; border: none; border-radius: 10px; width: 44px; font-size: 16px; cursor: pointer; }
        
        /* ЭКРАН ПРОФИЛЯ */
        .profile-card { background: #17212b; border-radius: 16px; padding: 24px 16px; text-align: center; margin: 20px; border: 1px solid #242f3d; }
        .profile-id { font-size: 32px; font-weight: bold; color: #64b5ef; letter-spacing: 2px; font-family: monospace; margin: 12px 0; }
    </style>
</head>
<body>
    <header>
        <button class="tab-btn active" onclick="switchTab('chats')">💬 Чаты</button>
        <button class="tab-btn" onclick="switchTab('profile')">👤 Профиль</button>
    </header>

    <!-- 1. ВКЛАДКА ЧАТОВ -->
    <div id="chats-screen" class="screen active">
        <div class="input-card">
            <input type="number" id="new-code-input" class="code-input" placeholder="Введите 6 цифр ID...">
            <button class="add-btn" onclick="addNewChat()">+ Чат</button>
        </div>
        <div id="chat-list" style="flex: 1; overflow-y: auto;"></div>
    </div>

    <!-- 2. ВКЛАДКА ОКНА СООБЩЕНИЙ -->
    <div id="messages-screen" class="screen">
        <div class="chat-header">
            <button class="back-btn" onclick="switchTab('chats')">◄</button>
            <div>
                <div id="active-chat-title" style="font-weight: bold; font-size: 15px;">Чат</div>
                <div id="active-chat-sub" style="color: #64b5ef; font-size: 11px;">в сети</div>
            </div>
        </div>
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="msg-input" class="msg-input" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendMsg()">
            <button class="send-btn" onclick="sendMsg()">➔</button>
        </div>
    </div>

    <!-- 3. ВКЛАДКА ПРОФИЛЯ -->
    <div id="profile-screen" class="screen">
        <div class="profile-card">
            <div style="font-size: 50px; background: #242f3d; width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px;">👤</div>
            <div style="color: #7f91a4; font-size: 13px;">ВАШ ПОСТОЯННЫЙ ID</div>
            <div id="my-profile-id" class="profile-id">------</div>
            <div style="color: #7f91a4; font-size: 12px;">Передайте этот ID другу или введите его на ПК для связи.</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAE06gMQSdQsHO3wqVDhRZM20FQsXwR7Dg",
            authDomain: "mesanger-1157b.firebaseapp.com",
            projectId: "mesanger-1157b",
            storageBucket: "mesanger-1157b.firebasestorage.app",
            messagingSenderId: "403397305101",
            appId: "1:403397305101:web:ea7e5d5dd076af9e754644",
            databaseURL: "https://mesanger-1157b-default-rtdb.firebaseio.com"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myUserId = localStorage.getItem('my_messenger_id');
        if (!myUserId || myUserId.length !== 6) {
            myUserId = Math.floor(100000 + Math.random() * 900000).toString();
            localStorage.setItem('my_messenger_id', myUserId);
        }
        document.getElementById('my-profile-id').innerText = myUserId;

        let savedChats = JSON.parse(localStorage.getItem('saved_chats') || '{}');
        let currentRoom = null;
        let activeListener = null;

        function renderChatList() {
            const list = document.getElementById('chat-list');
            list.innerHTML = '';
            for (let code in savedChats) {
                const div = document.createElement('div');
                div.className = 'chat-item';
                div.innerHTML = `
                    <div class="chat-info" onclick="openChat('${code}')">
                        <div class="chat-avatar">💬</div>
                        <div>
                            <div style="font-weight: bold; font-size: 15px;">${savedChats[code]}</div>
                            <div style="color:#7f91a4; font-size: 12px;">ID: ${code}</div>
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteChat('${code}')">✕</button>
                `;
                list.appendChild(div);
            }
        }

        function addNewChat() {
            const code = document.getElementById('new-code-input').value.trim();
            if (code.length === 6) {
                savedChats[code] = "Собеседник [" + code + "]";
                localStorage.setItem('saved_chats', JSON.stringify(savedChats));
                document.getElementById('new-code-input').value = '';
                renderChatList();
            }
        }

        function deleteChat(code) {
            if (confirm(`Удалить чат ${savedChats[code]}?`)) {
                delete savedChats[code];
                localStorage.setItem('saved_chats', JSON.stringify(savedChats));
                if (currentRoom === code) {
                    currentRoom = null;
                    switchTab('chats');
                }
                renderChatList();
            }
        }

        function openChat(code) {
            currentRoom = code;
            document.getElementById('active-chat-title').innerText = savedChats[code];
            document.getElementById('active-chat-sub').innerText = "ID: " + code + " • в сети";
            document.getElementById('messages').innerHTML = '';
            switchTab('messages');

            if (activeListener) activeListener.off();

            activeListener = db.ref('chats/' + currentRoom);
            activeListener.on('child_added', (snapshot) => {
                const data = snapshot.val();
                const type = data.sender === myUserId ? 'outgoing' : 'incoming';
                const timeStr = data.time ? new Date(data.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
                appendMessage(data.text, timeStr, type);
            });
        }

        function sendMsg() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (text && currentRoom) {
                db.ref('chats/' + currentRoom).push({ sender: myUserId, text: text, time: Date.now() });
                input.value = '';
            }
        }

        function appendMessage(text, timeStr, type) {
            const container = document.getElementById('messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg-bubble ${type}`;
            msgDiv.innerHTML = `
                <div>${text}</div>
                <div class="msg-time">${timeStr}</div>
            `;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        db.ref('chats').on('child_added', (roomSnapshot) => {
            const roomCode = roomSnapshot.key;
            roomSnapshot.ref.on('child_added', (msgSnapshot) => {
                const msg = msgSnapshot.val();
                if (msg.sender !== myUserId && !savedChats[roomCode]) {
                    savedChats[roomCode] = "Чат " + roomCode;
                    localStorage.setItem('saved_chats', JSON.stringify(savedChats));
                    renderChatList();
                }
            });
        });

        function switchTab(tab) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (tab === 'chats') {
                document.getElementById('chats-screen').classList.add('active');
                renderChatList();
            } else if (tab === 'profile') {
                document.getElementById('profile-screen').classList.add('active');
            } else if (tab === 'messages') {
                document.getElementById('messages-screen').classList.add('active');
            }
        }

        renderChatList();
    </script>
</body>
</html>
