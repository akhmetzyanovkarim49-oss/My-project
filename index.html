<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fakagram Mobile</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div id="app">
        <!-- Шапка -->
        <header class="top-bar">
            <div class="user-info">
                <h2>Fakagram</h2>
                <span id="my-id-display">ID: ...</span>
            </div>
            <button id="call-action-btn" onclick="makeCall()" class="icon-btn call-btn">📞</button>
        </header>

        <!-- Поиск / Открытие чата -->
        <div class="search-bar">
            <input type="text" id="target-id-input" placeholder="Введите ID собеседника...">
            <button onclick="startNewChat()">+ Чат</button>
        </div>

        <!-- Окно диалога -->
        <div id="chat-box" class="chat-box">
            <div class="placeholder-text">Выберите или введите ID для начала общения</div>
        </div>

        <!-- Панель ввода сообщения -->
        <div class="input-bar">
            <input type="text" id="message-input" placeholder="Написать сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()" class="send-btn">➤</button>
        </div>
    </div>

    <!-- Единственный логический скрипт -->
    <script src="main.js"></script>
</body>
</html>
